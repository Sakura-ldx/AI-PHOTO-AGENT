name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Privacy scan
        run: python scripts/check_privacy.py --history

      - name: Python tests
        run: python -m pytest tests -q -W error -p no:cacheprovider

      - name: Lightroom plug-in validation
        run: python scripts/validate_lightroom_plugin.py
